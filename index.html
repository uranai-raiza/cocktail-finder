<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宅飲みミックス</title>
  <meta name="description" content="手持ちのお酒・割り材を選ぶと、気軽な家飲みの組み合わせから本格派カクテルまで幅広く提案してくれるツール">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="header-icons" aria-hidden="true">🍸 🍋 🧊</p>
    <h1>宅飲みミックス</h1>
    <p>持っているお酒・割り材を選ぶと、今すぐできる飲み方を提案します♡</p>
  </header>
  <main class="app-layout">
    <section class="ingredients-panel" aria-label="材料選択">
      <h2>🧊 持っている材料</h2>
      <div class="select-group">
        <span class="select-group-label">お酒</span>
        <div class="select-row">
          <select id="select-liquor-1" aria-label="お酒1"></select>
          <select id="select-liquor-2" aria-label="お酒2"></select>
        </div>
      </div>
      <div class="select-group select-group-mixer">
        <span class="select-group-label">割り材</span>
        <div class="select-row">
          <select id="select-mixer-1" aria-label="割り材1"></select>
          <select id="select-mixer-2" aria-label="割り材2"></select>
        </div>
      </div>
    </section>
    <section class="recipes-panel" aria-label="提案一覧">
      <h2>🍹 こんな飲み方もできるよ</h2>
      <div id="casual-list"></div>
      <h2 class="formal-heading">🍸 本格派向けカクテル</h2>
      <div id="formal-list"></div>
    </section>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
