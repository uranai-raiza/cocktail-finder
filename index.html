<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宅飲みミックス</title>
  <meta name="description" content="手持ちのお酒・割り材を選ぶと、気軽な家飲みの組み合わせから本格派カクテルまで幅広く提案してくれるツール">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Antique+B1&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>宅飲みミックス</h1>
      <p>今夜の一杯、これで決まり♡</p>
    </div>
    <div class="header-badge" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M4 4H20L13 12.5V19H16V21H8V19H11V12.5L4 4Z" fill="#fff" fill-opacity="0.9"/>
      </svg>
    </div>
  </header>
  <main class="app-layout">
    <section class="ingredients-panel" aria-label="材料選択">
      <div class="ingredient-block ingredient-block-liquor">
        <div class="ingredient-badge ingredient-badge-liquor" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor">
            <path d="M9.2 2 L10.8 2 L10.8 5.5 C12.5 6.2 14 8 14 10.5 L14 16 C14 18.5 12.2 20 10 20 C7.8 20 6 18.5 6 16 L6 10.5 C6 8 7.5 6.2 9.2 5.5 Z"/>
            <ellipse cx="18.3" cy="14.6" rx="2.7" ry="1"/>
            <path d="M15.6 14.6 L16.9 18.5 C17 18.9 17.6 19.1 18.3 19.1 C19 19.1 19.6 18.9 19.7 18.5 L21 14.6 Z"/>
          </svg>
        </div>
        <span class="ingredient-block-label">お酒</span>
        <div class="select-col">
          <select id="select-liquor-1" aria-label="お酒1"></select>
          <input type="text" id="input-liquor-2" list="liquor-datalist" aria-label="お酒2(自由入力)" placeholder="その他(自由入力)" autocomplete="off">
        </div>
      </div>
      <div class="ingredient-block ingredient-block-mixer">
        <div class="ingredient-badge ingredient-badge-mixer" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor">
            <rect x="9.6" y="2" width="4.8" height="1.6" rx="0.6"/>
            <path d="M10.2 3h3.6v3.8l3.6 8.5c0.9 2.1-0.6 4.4-2.9 4.4H9.5c-2.3 0-3.8-2.3-2.9-4.4l3.6-8.5V3z"/>
          </svg>
        </div>
        <span class="ingredient-block-label">割り材</span>
        <div class="select-col">
          <select id="select-mixer-1" aria-label="割り材1"></select>
          <input type="text" id="input-mixer-2" list="mixer-datalist" aria-label="割り材2(自由入力)" placeholder="その他(自由入力)" autocomplete="off">
        </div>
      </div>
      <datalist id="liquor-datalist"></datalist>
      <datalist id="mixer-datalist"></datalist>
    </section>
    <section class="recipes-panel" aria-label="提案一覧">
      <div class="section-label">
        <span aria-hidden="true">✨</span>
        <h2>こんな飲み方もできるよ</h2>
      </div>
      <div id="casual-list"></div>
      <div class="section-divider">
        <span class="divider-line" aria-hidden="true"></span>
        <span class="divider-label">本格派向けカクテル</span>
        <span class="divider-line" aria-hidden="true"></span>
      </div>
      <div id="formal-list"></div>
    </section>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
